<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — Viñeta Boutique</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">🍷 Viñeta Boutique</a>
  </nav>

  <main class="form-container">
    <h1 class="form-title" id="form-title">Iniciar sesión</h1>
    <p class="form-subtitle" id="form-subtitle">Bienvenido de vuelta a Viñeta Boutique</p>

    <form id="auth-form">
      <div class="form-group" id="name-group" style="display:none;">
        <label class="form-label">Nombre completo</label>
        <input type="text" id="name" class="form-input" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="tu@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn" style="margin-top:8px;">
        Ingresar
      </button>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:14px;color:var(--color-gray);">
      <span id="toggle-text">¿No tenés cuenta?</span>
      <a href="#" class="form-link" id="toggle-link">Registrate</a>
    </p>
  </main>

  <script src="js/api.js"></script>
  <script>
    const mode = new URLSearchParams(location.search).get('mode');
    let isRegister = mode === 'register';

    function updateForm() {
      document.getElementById('form-title').textContent = isRegister ? 'Crear cuenta' : 'Iniciar sesión';
      document.getElementById('form-subtitle').textContent = isRegister 
        ? 'Unite a Viñeta Boutique' : 'Bienvenido de vuelta a Viñeta Boutique';
      document.getElementById('name-group').style.display = isRegister ? 'block' : 'none';
      document.getElementById('submit-btn').textContent = isRegister ? 'Registrarme' : 'Ingresar';
      document.getElementById('toggle-text').textContent = isRegister ? '¿Ya tenés cuenta?' : '¿No tenés cuenta?';
      document.getElementById('toggle-link').textContent = isRegister ? 'Iniciar sesión' : 'Registrate';
    }

    updateForm();

    document.getElementById('toggle-link').addEventListener('click', (e) => {
      e.preventDefault();
      isRegister = !isRegister;
      updateForm();
    });

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;

      try {
        if (isRegister) {
          if (!name) {
            alert('El nombre es obligatorio');
            return;
          }
          await api('/auth/register', {
            method: 'POST',
            body: JSON.stringify({ name, email, password })
          });
          alert('Cuenta creada exitosamente. Ahora podés iniciar sesión.');
          isRegister = false;
          updateForm();
        } else {
          const data = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email, password })
          });
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        }
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
