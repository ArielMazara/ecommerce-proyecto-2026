<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto — Viñeta Boutique</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">🍷 Viñeta Boutique</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Catálogo</a>
      <div id="nav-auth"></div>
      <a href="carrito.html" class="cart-link">🛒<span id="cart-count">0</span></a>
    </div>
  </nav>

  <main class="container" style="padding-top:60px;">
    <div id="product-detail" style="display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start;">
      <!-- Se carga dinámicamente -->
    </div>
  </main>

  <footer class="footer">
    <p>© 2024 Viñeta Boutique</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function loadProduct() {
      const id = new URLSearchParams(location.search).get('id');
      const container = document.getElementById('product-detail');

      if (!id) {
        container.innerHTML = '<p>Producto no especificado</p>';
        return;
      }

      try {
        const p = await api(`/products/${id}`);
        container.innerHTML = `
          <img src="${p.image}" style="width:100%;max-width:450px;border-radius:12px;box-shadow:var(--shadow);object-fit:cover;" alt="${p.name}">
          <div style="flex:1;min-width:300px;">
            <span style="color:var(--color-gold);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:1px;">${p.category}</span>
            <h1 style="font-size:42px;margin:12px 0 16px;">${p.name}</h1>
            <p style="color:var(--color-gray);font-size:17px;line-height:1.7;margin-bottom:28px;">${p.description || 'Sin descripción'}</p>
            <div style="font-size:36px;font-weight:700;color:var(--color-burgundy);margin-bottom:28px;">$${Number(p.price).toLocaleString()}</div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
              <button class="btn btn-primary" style="padding:14px 36px;font-size:16px;" 
                onclick="addToCart({id:${p.id},name:'${p.name.replace(/'/g,"\'")}',price:${p.price},image:'${p.image}'})">
                Agregar al carrito
              </button>
              <a href="carrito.html" class="btn btn-outline" style="padding:14px 36px;font-size:16px;">Ver carrito</a>
            </div>
          </div>
        `;
      } catch {
        container.innerHTML = '<p style="color:var(--color-danger);font-size:18px;">Producto no encontrado</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProduct();
      updateCartCount();
    });
  </script>
</body>
</html>
