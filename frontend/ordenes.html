<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis pedidos — Viñeta Boutique</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">🍷 Viñeta Boutique</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Catálogo</a>
      <div id="nav-auth"></div>
      <a href="carrito.html" class="cart-link">🛒<span id="cart-count">0</span></a>
    </div>
  </nav>

  <main class="container" style="padding-top:60px;">
    <h1 class="section-title">Mis pedidos</h1>
    <div id="orders-list" style="margin-top:32px;"></div>
  </main>

  <footer class="footer">
    <p>© 2024 Viñeta Boutique</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function loadOrders() {
      if (!isLoggedIn()) {
        location.href = 'login.html';
        return;
      }

      const container = document.getElementById('orders-list');

      try {
        const orders = await api('/orders/my-orders');

        if (orders.length === 0) {
          container.innerHTML = `
            <div style="text-align:center;padding:60px 20px;">
              <div style="font-size:48px;margin-bottom:16px;">📦</div>
              <h2 style="font-family:'Playfair Display';font-size:24px;margin-bottom:8px;">No tenés pedidos aún</h2>
              <p style="color:var(--color-gray);margin-bottom:24px;">Tu historial de compras aparecerá acá.</p>
              <a href="index.html" class="btn btn-primary">Ir al catálogo</a>
            </div>
          `;
          return;
        }

        // Agrupar items por orden
        const grouped = {};
        orders.forEach(o => {
          if (!grouped[o.id]) {
            grouped[o.id] = {
              id: o.id,
              total: o.total,
              status: o.status,
              created_at: o.created_at,
              items: []
            };
          }
          grouped[o.id].items.push(o);
        });

        container.innerHTML = Object.values(grouped).map(o => `
          <div class="order-card">
            <div class="order-header">
              <div>
                <span style="font-size:12px;color:var(--color-gray);text-transform:uppercase;letter-spacing:1px;">Pedido #${o.id}</span>
                <div style="font-size:18px;font-weight:600;margin-top:4px;">$${Number(o.total).toLocaleString()}</div>
                <div style="font-size:12px;color:var(--color-gray);margin-top:2px;">${new Date(o.created_at).toLocaleDateString('es-AR')}</div>
              </div>
              <span class="order-status ${o.status}">
                ${o.status === 'paid' ? 'Pagado ✓' : o.status === 'pending' ? 'Pendiente ⏳' : o.status === 'shipped' ? 'Enviado 🚚' : 'Cancelado ✗'}
              </span>
            </div>
            <div class="order-items">
              ${o.items.map(i => `
                <div class="order-item-chip">
                  <img src="${i.image}" alt="${i.product_name}">
                  <div style="font-size:14px;"><strong>${i.product_name}</strong> x${i.quantity}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="color:var(--color-danger);text-align:center;padding:40px;">Error al cargar pedidos. Intentá más tarde.</p>';
      }
    }

    // Mostrar mensaje si viene de Mercado Pago
    const urlParams = new URLSearchParams(location.search);
    const status = urlParams.get('status');

    if (status === 'success') {
      setTimeout(() => showToast('¡Pago exitoso! Tu pedido fue registrado.'), 500);
    } else if (status === 'failure') {
      setTimeout(() => showToast('El pago fue rechazado. Intentá de nuevo.'), 500);
    } else if (status === 'pending') {
      setTimeout(() => showToast('Tu pago está pendiente de confirmación.'), 500);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadOrders();
      updateCartCount();
    });
  </script>
</body>
</html>
